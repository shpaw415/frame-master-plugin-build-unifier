name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-change:
    runs-on: ubuntu-latest
    outputs:
      package-json: ${{ steps.changed.outputs.package-json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Check for a package version change
        run: |
          if git diff --unified=0 "${{ github.event.before }}" "${{ github.sha }}" -- package.json | rg -q '^[+-]\s*"version":'; then
            echo "package-json=true" >> "$GITHUB_OUTPUT"
          else
            echo "package-json=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version-change
    if: needs.version-change.outputs.package-json == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Test package
        run: bun test

      - name: Publish with npm trusted publishing
        run: npx --yes npm@^11.5.1 publish --provenance --access public
